# Stage C: four complete passes over the immutable clean HQ H50 view.
extends:
  - ../vlajepa_robot_ft_lerobot_magna_hq_subtasks_delta_h100x8_b16_qwen35_2b_full_moge_vitb_vjepa_large.yaml

run_id: robot_ft_magna_hq_finetune_18d_delta_h100x8_b16

curriculum_stage:
  initialization: previous_stage_final
  optimizer_scheduler_rng_reset: true
  resume_policy: newest_complete_full_state_same_stage

framework:
  vj2_model:
    predictor_attention_backend: torch_sdpa

datasets:
  vla_data:
    normalization_statistics_artifact: /data/mehul-vla-jepa/data_contracts/realman_union_openpi_q01q99_v1.json
    normalization_statistics_artifact_sha256: 79212d802c009c00ebb33bd3945b00401ee5304873d1a3b26e1ada5ee3cdc0be
    action_representation_contract_sha256: 9e1df348fb137c206b42a183892e29ec6247595fffc232bb2d73d94b5f5f91ac
    frozen_train_view_manifest: /data/mehul-vla-jepa/data_contracts/views/magna_hq_clean_h50_v3.json
    frozen_train_view_manifest_sha256: 2d9f77bbfa6fe927afde4807ef48d8712b719bc132b9213384a7a3f825b454e7
    subtask_prompt_append_probability: 0.7

trainer:
  epochs: 4
  max_train_steps: auto
  checkpoint_eval_milestone_fractions: [1.0]
  checkpoint_eval_milestone_steps: auto
  checkpoint_eval_include_full_epoch_boundaries: true
  checkpoint_eval_milestones_only: true
  checkpoint_max_to_keep: 0
  num_warmup_steps: auto
  warmup_ratio: 0.05
  learning_rate:
    base: 4.0e-06
    qwen_vl_interface: 2.0e-06
    qwen_state_projector: 3.0e-05
    action_model: 3.0e-05
    vj_predictor: 3.0e-05
    depth_teacher_aux_head: 3.0e-05
  strict_learning_rate_groups: true
  # The model enters this stage with world-model pretraining and intervention
  # adaptation already complete.  Keep the steady-state auxiliary weight so
  # the fresh stage optimizer does not temporarily triple the WM objective
  # during the most behavior-specific fine-tuning phase.
  loss_scale:
    action: 1.0
    wm: 0.1
    wm_initial: 0.1
    wm_warmup_steps: 0
    depth_teacher: 0.016
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: null
    min_lr_rate: 0.05
  pretrained_checkpoint: null
  pretrained_checkpoint_sha256: null
  reload_modules: null
  is_resume: false
  resume_from_checkpoint: null
